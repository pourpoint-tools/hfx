name: Documentation

on:
  pull_request:
    paths:
      - docs/**
      - README.md
      - assets/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - assets/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pourpoint-tools/pourpoint
          ref: main
          path: .pourpoint
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build proposed HFX content with shared site configuration
        working-directory: .pourpoint
        run: uv run --frozen --group docs python scripts/build_docs.py --hfx-source "$GITHUB_WORKSPACE" --proposed-hfx
